<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
<defs>
  <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e1e24"/>
    <stop offset="100%" stop-color="#0f0f12"/>
  </linearGradient>
  <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f3e0aa"/>
    <stop offset="50%" stop-color="#d4af37"/>
    <stop offset="100%" stop-color="#aa7c11"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.5" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="134" rx="12" ry="12" fill="url(#tileBg)" stroke="url(#gold)" stroke-width="2.5"/>
<rect x="6" y="6" width="88" height="128" rx="10" ry="10" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
<text x="50" y="55" font-family="serif" font-size="34" font-weight="bold" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">三</text>
<text x="50" y="115" font-family="serif" font-size="42" font-weight="bold" fill="#ff3333" text-anchor="middle" filter="url(#glow)">萬</text>
</svg>
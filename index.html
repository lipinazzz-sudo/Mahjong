<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riichi Mahjong Soul 4P</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --table-bg: #1b4d2e;
            --table-dark: #0f331d;
            --gold: #f39c12;
            --tile-bg: #fffdf5;
            --tile-back: #2c3e50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #111; color: #fff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 15px; text-align: center; }
        .active { display: flex; }

        h1 { font-size: 2rem; margin-bottom: 20px; color: var(--gold); text-shadow: 2px 2px 4px #000; }
        button { background-color: var(--gold); color: #000; border: none; padding: 10px 20px; margin: 6px; font-size: 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
        button:active { transform: scale(0.95); }

        .panel { background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; width: 90%; max-width: 380px; margin-bottom: 15px; border: 1px solid #444; }
        select, input[type="range"] { width: 100%; padding: 8px; margin: 8px 0; border-radius: 4px; }

        /* --- MEJA MAHJONG SOUL (4 PLAYERS) --- */
        #game-board {
            width: 100vw; height: 100vh; background: radial-gradient(circle, var(--table-bg) 60%, var(--table-dark) 100%);
            display: grid; grid-template-rows: 70px 1fr 140px; grid-template-columns: 70px 1fr 70px;
            position: relative; box-shadow: inset 0 0 50px #000;
        }

        /* Opponents (Top, Left, Right) */
        .player-zone { display: flex; justify-content: center; align-items: center; position: relative; }
        .zone-top { grid-area: 1 / 2 / 2 / 3; flex-direction: row; }
        .zone-left { grid-area: 2 / 1 / 3 / 2; flex-direction: column; }
        .zone-right { grid-area: 2 / 3 / 3 / 4; flex-direction: column; }
        .zone-bottom { grid-area: 3 / 1 / 4 / 4; flex-direction: column; justify-content: flex-end; padding-bottom: 10px; }

        /* Tile Styling */
        .tile {
            background: var(--tile-bg); color: #111; border-radius: 4px;
            display: flex; justify-content: center; align-items: center;
            position: relative; box-shadow: 1px 2px 4px rgba(0,0,0,0.5);
            border-bottom: 4px solid #4a7c59; font-weight: bold; cursor: pointer; user-select: none;
        }
        .tile-back {
            background: linear-gradient(135deg, #2980b9 25%, var(--tile-back) 25%, var(--tile-back) 50%, #2980b9 50%, #2980b9 75%, var(--tile-back) 75%);
            background-size: 10px 10px; border: 1px solid #1a252f; border-bottom: 3px solid #111; border-radius: 3px;
        }

        /* Player Bottom Hand */
        .hand-bottom { display: flex; gap: 3px; justify-content: center; flex-wrap: nowrap; }
        .hand-bottom .tile { width: 36px; height: 52px; font-size: 22px; }
        .tile-drawn { margin-left: 10px; border: 2px solid var(--gold); } /* Batu yang baru diambil */
        
        .tile-helper {
            position: absolute; top: 1px; right: 2px; font-size: 9px; font-weight: bold; color: #c0392b;
            background: rgba(255,255,255,0.9); padding: 0 2px; border-radius: 2px; line-height: 1;
        }

        /* Enemy Face-down hands */
        .hand-top { display: flex; gap: 2px; }
        .hand-top .tile-back { width: 22px; height: 32px; }
        .hand-side { display: flex; flex-direction: column; gap: 2px; }
        .hand-side .tile-back { width: 32px; height: 18px; }

        /* Center Table / River */
        .center-realm {
            grid-area: 2 / 2 / 3 / 3; display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 10px; position: relative;
        }
        .river-grid { display: flex; flex-wrap: wrap; gap: 2px; max-width: 200px; max-height: 70px; justify-content: center; align-content: flex-start; }
        .discard-tile { width: 22px; height: 30px; font-size: 14px; background: #eee; border-radius: 2px; display: flex; justify-content: center; align-items: center; position: relative; }

        /* Action Bar overlay (Pon, Chi, Kan, Ron, Skip) */
        #action-bar {
            position: absolute; bottom: 150px; display: none; gap: 8px; background: rgba(0,0,0,0.85);
            padding: 8px 15px; border-radius: 30px; border: 2px solid var(--gold); z-index: 99;
        }
        .act-btn { padding: 6px 14px; font-size: 0.9rem; border-radius: 20px; }
        .act-ron { background: #e74c3c; color: #fff; }
        .act-pon { background: #3498db; color: #fff; }
        .act-chi { background: #2ecc71; color: #fff; }
        .act-skip { background: #7f8c8d; color: #fff; }
    </style>
</head>
<body>

    <audio id="bg-music" loop><source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_51a37c4493.mp3?filename=chinese-traditional-music-110072.mp3" type="audio/mpeg"></audio>

    <!-- MAIN MENU -->
    <div id="screen-main" class="screen active">
        <h1>Mahjong Soul 4P</h1>
        <button onclick="nav('screen-play')" id="btn-play">Play</button>
        <button onclick="nav('screen-settings')" id="btn-settings">Settings</button>
    </div>

    <!-- SETTINGS -->
    <div id="screen-settings" class="screen">
        <h1 id="txt-settings">Settings</h1>
        <div class="panel">
            <label id="txt-lang">Bahasa / Language:</label>
            <select id="lang-select" onchange="changeLanguage()">
                <option value="id">Indonesia</option>
                <option value="en">English</option>
            </select>
            <label id="txt-volume">Volume Musik:</label>
            <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.5" onchange="updateVolume()">
        </div>
        <button onclick="nav('screen-main')" id="btn-back-settings">Back</button>
    </div>

    <!-- PLAY MENU -->
    <div id="screen-play" class="screen">
        <h1 id="txt-play-menu">Play Menu</h1>
        <div class="panel">
            <h3 id="txt-how" style="color: var(--gold);">Aturan 4 Pemain</h3>
            <p id="txt-how-desc" style="font-size: 0.8rem; text-align: left; margin-top: 5px;">
                4 Pemain bertanding. Setiap giliran: Ambil 1 batu, lalu buang 1 batu. Gunakan Pon/Chi/Kan/Ron saat musuh membuang batu.
            </p>
        </div>
        <button onclick="nav('screen-ai-diff')" id="btn-vs-ai">Vs AI (4 Players)</button>
        <button onclick="nav('screen-online-room')" id="btn-vs-player">Vs Player Online (P2P)</button>
        <button onclick="nav('screen-main')" id="btn-back-play">Back</button>
    </div>

    <!-- AI DIFFICULTY -->
    <div id="screen-ai-diff" class="screen">
        <h1 id="txt-ai-level">Select AI Level</h1>
        <button onclick="start4PGame('Easy')">Easy</button>
        <button onclick="start4PGame('Medium')">Medium</button>
        <button onclick="start4PGame('Hard')">Hard</button>
        <button onclick="nav('screen-play')" id="btn-back-ai">Back</button>
    </div>

    <!-- ONLINE ROOM -->
    <div id="screen-online-room" class="screen">
        <h1>Online Room (4P)</h1>
        <div class="panel">
            <div id="room-status" style="color: var(--gold); font-size: 0.85rem; word-break: break-all;"></div>
        </div>
        <button onclick="createRoom()">Buat Room (Host)</button>
        <button onclick="joinRoom()">Masuk Room (Join)</button>
        <button onclick="nav('screen-play')">Back</button>
    </div>

    <!-- MAIN GAME SCREEN (4 PLAYERS BOARD) -->
    <div id="screen-game" class="screen" style="padding:0;">
        <div id="game-board">
            
            <!-- TOP OPPONENT (P2) -->
            <div class="player-zone zone-top">
                <div style="position:absolute; top:5px; font-size:11px; color:#aaa;">P2 (North)</div>
                <div class="hand-top" id="hand-p2"></div>
            </div>

            <!-- LEFT OPPONENT (P3) -->
            <div class="player-zone zone-left">
                <div style="position:absolute; left:2px; font-size:11px; color:#aaa; writing-mode: vertical-rl;">P3 (West)</div>
                <div class="hand-side" id="hand-p3"></div>
            </div>

            <!-- RIGHT OPPONENT (P1) -->
            <div class="player-zone zone-right">
                <div style="position:absolute; right:2px; font-size:11px; color:#aaa; writing-mode: vertical-rl;">P1 (East)</div>
                <div class="hand-side" id="hand-p1"></div>
            </div>

            <!-- CENTER REALM (DISCARD RIVER & WALL INFO) -->
            <div class="center-realm">
                <div style="font-size:12px; color:var(--gold);" id="wall-counter">Batu Sisa: 84</div>
                <div id="info-status" style="font-size:13px; color:#fff; text-align:center;">Giliran Anda</div>
                <div class="river-grid" id="river-discards"></div>
            </div>

            <!-- ACTION OVERLAY (PON/CHI/KAN/RON) -->
            <div id="action-bar">
                <button class="act-btn act-ron" onclick="triggerAction('RON')">RON</button>
                <button class="act-btn act-pon" onclick="triggerAction('PON')">PON</button>
                <button class="act-btn act-chi" onclick="triggerAction('CHI')">CHI</button>
                <button class="act-btn act-skip" onclick="triggerAction('SKIP')">SKIP</button>
            </div>

            <!-- BOTTOM PLAYER (YOU - P0) -->
            <div class="player-zone zone-bottom">
                <div style="margin-bottom: 5px; display:flex; gap:10px; align-items:center;">
                    <span style="font-size:12px; color:var(--gold);">Anda (South)</span>
                    <button onclick="autoSortHand()" style="padding:3px 10px; font-size:11px; margin:0;">Auto Susun</button>
                </div>
                <div class="hand-bottom" id="hand-p0"></div>
            </div>

        </div>
        <button onclick="quitGame()" style="position:absolute; top:5px; left:5px; padding:4px 10px; font-size:11px; z-index:100;">Quit</button>
    </div>

<script>
    // --- DICTIONARY & LANG ---
    const dict = {
        'id': { 'title': 'Mahjong Soul 4P', 'play': 'Main', 'settings': 'Pengaturan', 'lang': 'Bahasa:', 'vol': 'Volume:', 'back': 'Kembali', 'playMenu': 'Pilih Mode', 'how': 'Aturan 4 Pemain', 'howDesc': 'Ambil 1 batu saat giliran, buang 1 batu. Respon Pon/Chi/Ron saat lawan membuang batu.', 'vsAI': 'Vs AI (4 Players)', 'vsPlayer': 'Vs Player Online', 'aiLevel': 'Tingkat AI' },
        'en': { 'title': 'Mahjong Soul 4P', 'play': 'Play', 'settings': 'Settings', 'lang': 'Language:', 'vol': 'Volume:', 'back': 'Back', 'playMenu': 'Select Mode', 'how': '4-Player Rules', 'howDesc': 'Draw 1 tile on turn, discard 1 tile. Call Pon/Chi/Ron on enemy discards.', 'vsAI': 'Vs AI (4 Players)', 'vsPlayer': 'Vs Player Online', 'aiLevel': 'AI Level' }
    };
    let currentLang = 'id';
    function changeLanguage() {
        currentLang = document.getElementById('lang-select').value;
        document.getElementById('txt-title').innerText = dict[currentLang]['title'];
        document.getElementById('btn-play').innerText = dict[currentLang]['play'];
        document.getElementById('btn-settings').innerText = dict[currentLang]['settings'];
        document.getElementById('txt-settings').innerText = dict[currentLang]['settings'];
        document.getElementById('txt-lang').innerText = dict[currentLang]['lang'];
        document.getElementById('txt-volume').innerText = dict[currentLang]['vol'];
        document.getElementById('btn-back-settings').innerText = dict[currentLang]['back'];
        document.getElementById('btn-back-play').innerText = dict[currentLang]['back'];
        document.getElementById('btn-back-ai').innerText = dict[currentLang]['back'];
        document.getElementById('txt-play-menu').innerText = dict[currentLang]['playMenu'];
        document.getElementById('txt-how').innerText = dict[currentLang]['how'];
        document.getElementById('txt-how-desc').innerText = dict[currentLang]['howDesc'];
        document.getElementById('btn-vs-ai').innerText = dict[currentLang]['vsAI'];
        document.getElementById('btn-vs-player').innerText = dict[currentLang]['vsPlayer'];
        document.getElementById('txt-ai-level').innerText = dict[currentLang]['aiLevel'];
    }

    const bgMusic = document.getElementById('bg-music');
    let musicStarted = false;
    function nav(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if (!musicStarted && screenId !== 'screen-main') { bgMusic.play().catch(()=>{}); musicStarted = true; }
    }
    function updateVolume() { bgMusic.volume = document.getElementById('vol-slider').value; }

    // --- MAHJONG TILE SYSTEM ---
    const rawTiles = [
        // Manzu (1M-9M)
        { suit: 'man', val: 1, char: '🀇', helper: '1M', sort: 11 }, { suit: 'man', val: 2, char: '🀈', helper: '2M', sort: 12 }, { suit: 'man', val: 3, char: '🀉', helper: '3M', sort: 13 },
        { suit: 'man', val: 4, char: '🀊', helper: '4M', sort: 14 }, { suit: 'man', val: 5, char: '🀋', helper: '5M', sort: 15 }, { suit: 'man', val: 6, char: '🀌', helper: '6M', sort: 16 },
        { suit: 'man', val: 7, char: '🀍', helper: '7M', sort: 17 }, { suit: 'man', val: 8, char: '🀎', helper: '8M', sort: 18 }, { suit: 'man', val: 9, char: '🀏', helper: '9M', sort: 19 },
        // Souzu (1S-9S)
        { suit: 'sou', val: 1, char: '🀐', helper: '1S', sort: 21 }, { suit: 'sou', val: 2, char: '🀑', helper: '2S', sort: 22 }, { suit: 'sou', val: 3, char: '🀒', helper: '3S', sort: 23 },
        { suit: 'sou', val: 4, char: '🀓', helper: '4S', sort: 24 }, { suit: 'sou', val: 5, char: '🀔', helper: '5S', sort: 25 }, { suit: 'sou', val: 6, char: '🀕', helper: '6S', sort: 26 },
        { suit: 'sou', val: 7, char: '🀖', helper: '7S', sort: 27 }, { suit: 'sou', val: 8, char: '🀗', helper: '8S', sort: 28 }, { suit: 'sou', val: 9, char: '🀘', helper: '9S', sort: 29 },
        // Pinzu (1P-9P)
        { suit: 'pin', val: 1, char: '🀙', helper: '1P', sort: 31 }, { suit: 'pin', val: 2, char: '🀚', helper: '2P', sort: 32 }, { suit: 'pin', val: 3, char: '🀛', helper: '3P', sort: 33 },
        { suit: 'pin', val: 4, char: '🀜', helper: '4P', sort: 34 }, { suit: 'pin', val: 5, char: '🀝', helper: '5P', sort: 35 }, { suit: 'pin', val: 6, char: '🀞', helper: '6P', sort: 36 },
        { suit: 'pin', val: 7, char: '🀟', helper: '7P', sort: 37 }, { suit: 'pin', val: 8, char: '🀠', helper: '8P', sort: 38 }, { suit: 'pin', val: 9, char: '🀡', helper: '9P', sort: 39 },
        // Winds & Dragons
        { suit: 'wind', val: 'E', char: '🀀', helper: 'E', sort: 41 }, { suit: 'wind', val: 'S', char: '🀁', helper: 'S', sort: 42 },
        { suit: 'wind', val: 'W', char: '🀂', helper: 'W', sort: 43 }, { suit: 'wind', val: 'N', char: '🀃', helper: 'N', sort: 44 },
        { suit: 'dragon', val: 'R', char: '🀄', helper: 'R', sort: 51 }, { suit: 'dragon', val: 'G', char: '🀅', helper: 'G', sort: 52 }, { suit: 'dragon', val: 'W', char: '🀆', helper: 'W', sort: 53 }
    ];

    let fullWall = [];
    let players = [{ hand: [] }, { hand: [] }, { hand: [] }, { hand: [] }];
    let currentTurn = 0; // 0: You, 1: Right, 2: Top, 3: Left
    let drawnTile = null;
    let isCanDiscard = false;
    let lastDiscardedTile = null;

    function buildWall() {
        fullWall = [];
        // Complete 136 Mahjong Tiles (4 of each)
        for(let i=0; i<4; i++) {
            rawTiles.forEach(t => fullWall.push({...t, uid: Math.random()}));
        }
        // Shuffle Wall
        fullWall.sort(() => Math.random() - 0.5);
    }

    function start4PGame(diff) {
        buildWall();
        players = [{ hand: [] }, { hand: [] }, { hand: [] }, { hand: [] }];
        document.getElementById('river-discards').innerHTML = '';
        
        // Deal 13 initial tiles to all 4 players
        for(let i=0; i<13; i++) {
            for(let p=0; p<4; p++) {
                players[p].hand.push(fullWall.pop());
            }
        }

        autoSortHand();
        nav('screen-game');
        currentTurn = 0;
        processTurn();
    }

    // AUTO SUSUN BLOCK (PLAYER 0)
    function autoSortHand() {
        players[0].hand.sort((a, b) => a.sort - b.sort);
        renderHands();
    }

    function renderHands() {
        // Render Player 0 (Bottom - Face Up)
        const p0Hand = document.getElementById('hand-p0');
        p0Hand.innerHTML = '';
        players[0].hand.forEach((t, idx) => {
            let el = document.createElement('div');
            el.className = 'tile' + (t === drawnTile ? ' tile-drawn' : '');
            el.innerHTML = `${t.char}<span class="tile-helper">${t.helper}</span>`;
            el.onclick = () => { if(isCanDiscard) playerDiscard(idx); };
            p0Hand.appendChild(el);
        });

        // Render Opponents (Face Down Tiles)
        renderOpponent('hand-p1', players[1].hand.length, 'side');
        renderOpponent('hand-p2', players[2].hand.length, 'top');
        renderOpponent('hand-p3', players[3].hand.length, 'side');

        document.getElementById('wall-counter').innerText = `Batu Sisa: ${fullWall.length}`;
    }

    function renderOpponent(elementId, count, type) {
        const parent = document.getElementById(elementId);
        parent.innerHTML = '';
        for(let i=0; i<count; i++) {
            let b = document.createElement('div');
            b.className = 'tile-back';
            parent.appendChild(b);
        }
    }

    // TURN CYCLE MANAGEMENT (DRAW -> DISCARD)
    function processTurn() {
        if(fullWall.length === 0) {
            alert("Permainan Seri! Batu di tembok habis.");
            nav('screen-main');
            return;
        }

        renderHands();
        const turnNames = ["Anda", "P1 (Right)", "P2 (Top)", "P3 (Left)"];
        document.getElementById('info-status').innerText = `Giliran: ${turnNames[currentTurn]}`;

        // Step 1: Ambil 1 batu baru (Draw Phase)
        drawnTile = fullWall.pop();
        players[currentTurn].hand.push(drawnTile);
        renderHands();

        if (currentTurn === 0) {
            // Player's Turn
            isCanDiscard = true;
        } else {
            // AI Turn
            isCanDiscard = false;
            setTimeout(() => {
                // AI membuang 1 batu acak
                let discardIdx = Math.floor(Math.random() * players[currentTurn].hand.length);
                let discarded = players[currentTurn].hand.splice(discardIdx, 1)[0];
                executeDiscard(currentTurn, discarded);
            }, 1200);
        }
    }

    function playerDiscard(index) {
        if(!isCanDiscard) return;
        isCanDiscard = false;
        let discarded = players[0].hand.splice(index, 1)[0];
        drawnTile = null;
        executeDiscard(0, discarded);
    }

    function executeDiscard(playerIdx, tile) {
        lastDiscardedTile = tile;

        // Render to Discard River
        const river = document.getElementById('river-discards');
        let dEl = document.createElement('div');
        dEl.className = 'discard-tile';
        dEl.innerHTML = `${tile.char}<span style="position:absolute;top:0;right:1px;font-size:7px;color:#cc0000">${tile.helper}</span>`;
        river.appendChild(dEl);

        // Jika musuh yang buang, cek apakah Player 0 bisa PON/CHI/RON
        if (playerIdx !== 0 && checkPlayerCallOpportunity(tile)) {
            document.getElementById('action-bar').style.display = 'flex';
        } else {
            nextTurn();
        }
    }

    function checkPlayerCallOpportunity(tile) {
        // Logika Sederhana: Cek Pon (apakah pemain punya 2 batu kembar di tangan)
        let matches = players[0].hand.filter(t => t.char === tile.char);
        return matches.length >= 2;
    }

    function triggerAction(type) {
        document.getElementById('action-bar').style.display = 'none';
        if (type === 'RON') {
            alert("RON! Anda Memenangkan Pertandingan!");
            nav('screen-main');
            return;
        } else if (type === 'PON') {
            // Pindahkan batu dari river ke tangan (Simulasi Pon)
            alert(`Anda Melakukan PON pada batu ${lastDiscardedTile.char}!`);
        }
        nextTurn();
    }

    function nextTurn() {
        document.getElementById('action-bar').style.display = 'none';
        currentTurn = (currentTurn + 1) % 4;
        processTurn();
    }

    function quitGame() {
        if (peer) peer.destroy();
        nav('screen-main');
    }

    // PEERJS ONLINE MULTIPLAYER
    let peer = null, conn = null;
    function createRoom() {
        document.getElementById('room-status').innerText = "Menghubungkan P2P...";
        peer = new Peer();
        peer.on('open', id => { document.getElementById('room-status').innerText = `KODE ROOM (HOST):\n${id}`; });
        peer.on('connection', c => { conn = c; alert("Pemain terhubung!"); start4PGame('Medium'); });
    }
    function joinRoom() {
        let code = prompt("Masukkan Kode Room Host:");
        if(!code) return;
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect(code);
            conn.on('open', () => { alert("Berhasil Masuk Room!"); start4PGame('Medium'); });
        });
    }

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    changeLanguage();
</script>
</body>
</html>

    <path d="M500 923l35 35-35 35-35-35z"/>
    <path d="M7 500l35-35 35 35-35 35z"/>
    <path d="M923 500l35-35 35 35-35 35z"/>
  </g>

  <!-- upper decorative cloud / ruyi corners -->
  <g stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M83 184c23-40 57-53 90-30 2-47 40-78 82-63 29-33 78-26 97 8 7 12 10 24 9 36"/>
    <path d="M917 184c-23-40-57-53-90-30-2-47-40-78-82-63-29-33-78-26-97 8-7 12-10 24-9 36"/>
    <path d="M83 816c23 40 57 53 90 30 2 47 40 78 82 63 29 33 78 26 97-8 7-12 10-24 9-36"/>
    <path d="M917 816c-23 40-57 53-90 30-2 47-40 78-82 63-29 33-78 26-97-8-7-12-10-24-9-36"/>
  </g>

  <!-- classic cloud panels -->
  <g fill="url(#gold)" opacity=".96">
    <path d="M66 116c22-11 40-6 48 11 8-21 31-27 47-10 11-23 43-26 58-7 8 9 10 20 8 31H66z"/>
    <path d="M934 116c-22-11-40-6-48 11-8-21-31-27-47-10-11-23-43-26-58-7-8 9-10 20-8 31h161z"/>
    <path d="M66 884c22 11 40 6 48-11 8 21 31 27 47 10 11 23 43 26 58 7 8-9 10-20 8-31H66z"/>
    <path d="M934 884c-22 11-40 6-48-11-8 21-31 27-47 10-11 23-43 26-58 7-8-9-10-20-8-31h161z"/>
  </g>

  <!-- side fan ornaments -->
  <g fill="url(#gold)" opacity=".88">
    <path d="M61 500c25-26 55-31 84 0-29 31-59 26-84 0z"/>
    <path d="M939 500c-25-26-55-31-84 0 29 31 59 26 84 0z"/>
  </g>

  <!-- tiny knot motifs in corners -->
  <g stroke="#ffe7a2" stroke-opacity=".8" stroke-width="4">
    <path d="M92 143h28v28H92z"/>
    <path d="M880 143h28v28h-28z"/>
    <path d="M92 829h28v28H92z"/>

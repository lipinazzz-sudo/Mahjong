<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <defs>
    <linearGradient id="gold" x1="90" y1="60" x2="910" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4716"/>
      <stop offset="0.14" stop-color="#c99337"/>
      <stop offset="0.29" stop-color="#ffe7a1"/>
      <stop offset="0.44" stop-color="#b87922"/>
      <stop offset="0.56" stop-color="#f8d476"/>
      <stop offset="0.72" stop-color="#8f5c1c"/>
      <stop offset="0.88" stop-color="#f2cb6c"/>
      <stop offset="1" stop-color="#704718"/>
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="21" y="21" width="958" height="958" rx="122" stroke="#4d3212" stroke-width="24"/>
  <rect x="27" y="27" width="946" height="946" rx="116" stroke="url(#gold)" stroke-width="18" filter="url(#softGlow)"/>
  <rect x="42" y="42" width="916" height="916" rx="103" stroke="#fff1bb" stroke-opacity=".60" stroke-width="4"/>
  <rect x="55" y="55" width="890" height="890" rx="91" stroke="#a66f26" stroke-opacity=".88" stroke-width="4"/>
  <rect x="71" y="71" width="858" height="858" rx="78" stroke="#f0c972" stroke-opacity=".28" stroke-width="3"/>

  <!-- diamond ornaments at the middle of every side -->
  <g fill="url(#gold)" stroke="#fff0b8" stroke-opacity=".72" stroke-width="3">
